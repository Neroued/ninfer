schema_version: 1

targets:
  qwen38fn:
    protocol: openai_chat
    base_url: http://192.168.1.51:18080/v1
    model: qwen3.8-flash-next
    max_concurrency: 8
    request:
      timeout_seconds: 86400
      retries: 2
      retry_interval_seconds: 10

suites:
  full:
    jobs:
      - id: gpqa_diamond
        backend: evalscope
        dataset: gpqa_diamond
        target: qwen38fn
        repeats: 4
        generation: &generation
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          presence_penalty: 0.0
          frequency_penalty: 0.0
          max_tokens: 131072
          # Omit the API seed so repeated samples draw independently.
          extra_body:
            enable_thinking: true
            reasoning_effort: xhigh
            min_p: 0.0
        backend_args: &backend
          seed: 42 # Dataset ordering and choice shuffling only.
          few_shot_num: 0
          judge_strategy: rule
          dataset_hub: modelscope

      - id: aime26
        backend: evalscope
        dataset: aime26
        target: qwen38fn
        repeats: 3
        generation: *generation
        backend_args: *backend

      - id: erqa
        backend: evalscope
        dataset: erqa
        target: qwen38fn
        generation: *generation
        backend_args: *backend

      - id: real_world_qa
        backend: evalscope
        dataset: real_world_qa
        target: qwen38fn
        generation: *generation
        backend_args: *backend

      - id: mmmu_pro
        backend: evalscope
        dataset: mmmu_pro
        target: qwen38fn
        generation: *generation
        backend_args:
          <<: *backend
          dataset_args:
            extra_params:
              dataset_format: standard (10 options)

runtime:
  max_parallel_jobs: 1
  runs_dir: .agent-tmp/qwen3_8fn-eval/runs
  progress:
    enabled: true
    refresh_seconds: 1
    heartbeat_seconds: 30
  samples:
    retention: all
